name: CI/CD - GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Fallback para SPA
        run: cp dist/index.html dist/404.html

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verificar despliegue
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que la app responde
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          echo "Verificando $URL"
          for i in $(seq 1 10); do
            HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            MANIFEST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}manifest.webmanifest")
            echo "Intento $i -> página: $HOME_STATUS, manifest: $MANIFEST_STATUS"
            if [ "$HOME_STATUS" = "200" ] && [ "$MANIFEST_STATUS" = "200" ]; then
              echo "✅ La app está publicada y funcionando"
              exit 0
            fi
            sleep 10
          done
          echo "❌ La app no respondió correctamente"
          exit 1
